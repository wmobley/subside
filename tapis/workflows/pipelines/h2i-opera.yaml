---
# Pipeline A: SUBSIDE H2I OPERA — discover + download + preview in ONE job.
#
# Collapsed from the old discover/download split into a single monolithic
# `run` task. `STAGE=run` (analysis.h2i_lab.cli run) already calls
# preflight() internally before downloading, so the single job writes BOTH
# preflight-manifest.json and run-manifest.json to its archive — the discover
# gate added a second job for no extra information.

id: subside-h2i-opera
type: workflow
description: |
  Discovery + Earthdata download + preview + zip archive for OPERA DISP-S1
  over an AOI, as a single self-contained Tapis job. Companion pipeline
  `subside-werc-opera` is the same shape but continues through the
  stack/reference/velocity/export analysis.
owner: ${apiUserId}
group_id: subside-ops
tenant_id: portals

params:
  start_date:          {type: string, required: true}
  end_date:            {type: string, required: true}
  aoi_geojson_uri:     {type: string, required: true, description: "tapis:// URI to the AOI GeoJSON"}
  earthdata_netrc_uri: {type: string, required: false, description: "Optional tapis:// URI to a protected .netrc"}
  num_workers:         {type: integer, default: 4}
  min_overlap_percent: {type: number, default: 50.0}
  allocation:          {type: string, required: true, description: "TACC allocation to charge"}
  update_conda_env:    {type: string, default: "false"}
  # --- STAC/CKAN publishing (stac-platform). Leave ckan_token/stac_url blank to
  #     disable: the stac-publish task no-ops when either is unset. ---
  stac_collection:     {type: string, default: "subsidence-rates", description: "CKAN dataset = STAC Collection id"}
  stac_item_id:        {type: string, required: false, description: "Unique STAC Item id for this run (defaults to the run job name)"}
  ckan_url:            {type: string, default: "https://ckan.tacc.utexas.edu"}
  ckan_org:            {type: string, default: "tacc-water"}
  ckan_token:          {type: string, required: false, description: "CKAN API token (blank disables publishing)"}
  stac_url:            {type: string, required: false, description: "STAC API base URL (blank disables publishing)"}
  stac_token:          {type: string, required: false, description: "STAC Transactions bearer token"}

tasks:

  - id: run
    type: tapis_job
    depends_on: []
    description: Discover + download + crop + preview + archive, all in one job (STAGE=run).
    tapis_job_def:
      appId: subside-h2i-opera-analysis
      appVersion: "0.1.1"
      name: subside-h2i-opera-{{ args.start_date }}-{{ args.end_date }}
      nodeCount: 1
      coresPerNode: 16
      memoryMB: 128000
      maxMinutes: 240
      fileInputs:
        - name: aoi-geojson
          sourceUrl: "{{ args.aoi_geojson_uri }}"
        - name: earthdata-netrc
          sourceUrl: "{{ args.earthdata_netrc_uri }}"
      parameterSet:
        # Run parameters are passed as env-variable input fields; the app's
        # run.sh materializes them into the CLI config (no run-config file).
        envVariables:
          - {key: STAGE, value: "run"}
          - {key: UPDATE_CONDA_ENV, value: "{{ args.update_conda_env }}"}
          - {key: START_DATE, value: "{{ args.start_date }}"}
          - {key: END_DATE, value: "{{ args.end_date }}"}
          - {key: NUM_WORKERS, value: "{{ args.num_workers }}"}
          - {key: MIN_OVERLAP_PERCENT, value: "{{ args.min_overlap_percent }}"}
        schedulerOptions:
          - name: "TACC Allocation"
            arg: "{{ args.allocation }}"

  - id: publish
    type: function
    runtime: "python:3.11"
    installer: pip          # required by the Tapis Workflows FunctionTask schema
    packages: []            # stdlib-only; no third-party deps to install
    depends_on:
      - id: run
    description: |
      Stdlib-only Python. Reads preflight-manifest.json + run-manifest.json from
      the single run job's archive and emits a unified subside-run-manifest.json
      the UI can consume. (Under the manager this runs locally via the Files API.)
    inputs:
      preflight_manifest_uri: "{{ tasks.run.outputs.archive }}/output/preflight-manifest.json"
      run_manifest_uri:       "{{ tasks.run.outputs.archive }}/output/run-manifest.json"
    code: |
      import json, os, urllib.request

      def _load(uri):
          if uri.startswith("tapis://"):
              raise RuntimeError("Configure tapis-files fetch in your workflows runner.")
          with urllib.request.urlopen(uri) as f:
              return json.load(f)

      preflight = _load(os.environ["INPUTS_PREFLIGHT_MANIFEST_URI"])
      run_manifest = _load(os.environ["INPUTS_RUN_MANIFEST_URI"])

      unified = {
          "pipeline": "subside-h2i-opera",
          "schema_version": "v0",
          "frame_ids": preflight.get("frame_ids", []),
          "product_count": preflight.get("product_count", 0),
          "warnings": preflight.get("warnings", []) + run_manifest.get("warnings", []),
          "artifacts": run_manifest.get("artifacts", {}),
          "config": run_manifest.get("config", {}),
      }
      with open(os.environ["OUTPUT_DIR"] + "/subside-run-manifest.json", "w") as f:
          json.dump(unified, f, indent=2, sort_keys=True, default=str)

  - id: stac-publish
    type: function
    runtime: "python:3.11"
    installer: pip
    # Lightweight env: pip-installs the stac-platform publish core (which pulls
    # ckanapi + httpx). No container image, no Singularity, no HPC allocation.
    packages:
      - "git+https://github.com/wmobley/stac-platform.git"
    depends_on:
      - id: run
    description: |
      Dual-write this run to CKAN (asset store) + the STAC API (Transactions) via
      stacmap.publish. Manifest-driven: the orchestrator (which holds Tapis creds)
      fetches run-manifest.json from the run job's tapis:// archive, then fetches
      exactly the COG(s)/overlay it names and publishes. No-ops when ckan_token /
      stac_url are blank, so it is safe to leave in.
    inputs:
      manifest_uri: "{{ tasks.run.outputs.archive }}/output/run-manifest.json"
    env:
      COLLECTION:  "{{ args.stac_collection }}"
      ITEM_ID:     "{{ args.stac_item_id | default('subside-h2i-' ~ args.start_date ~ '-' ~ args.end_date, true) }}"
      CKAN_URL:    "{{ args.ckan_url }}"
      CKAN_ORG:    "{{ args.ckan_org }}"
      CKAN_TOKEN:  "{{ args.ckan_token }}"
      STAC_URL:    "{{ args.stac_url }}"
      STAC_TOKEN:  "{{ args.stac_token }}"
    code: |
      # Hosted-engine path (the local orchestrator runs _run_stac_publish instead,
      # which fetches tapis:// files via the Files API). Assumes the engine staged
      # the manifest + COG(s) into one dir; stacmap.publish derives the rest.
      import os
      from stacmap.publish import publish_from_dir
      if not (os.environ.get("CKAN_TOKEN") and os.environ.get("STAC_URL")):
          print("stac-publish: disabled (CKAN_TOKEN/STAC_URL unset) — skipping.")
      else:
          manifest = os.environ.get("INPUTS_MANIFEST_LOCAL", "run-manifest.json")
          item = publish_from_dir(collection_id=os.environ["COLLECTION"],
                                  manifest_path=manifest, item_id=os.environ["ITEM_ID"],
                                  files_dir=os.path.dirname(manifest) or ".")
          print(f"published {item['id']} -> {os.environ['COLLECTION']}")
