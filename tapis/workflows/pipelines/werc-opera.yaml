---
# Pipeline B: SUBSIDE WERC OPERA — full analysis in ONE job.
#
# Collapsed from the old 6-task split (discover/download/build-stack/
# compute-reference/estimate-velocity/export-geotiffs) into a single
# monolithic `run` task. `STAGE=run` (analysis.werc.cli run) is
# self-contained: it does its own discover + download (via the embedded
# h2i runner, unless skip_download=true), then builds the stack, picks a
# reference, estimates velocity, and exports both GeoTIFFs — all in one
# process, writing werc-run-manifest.json. No inter-task archive handoff.

id: subside-werc-opera
type: workflow
description: |
  Full SUBSIDE WERC pipeline as a single self-contained Tapis job: discovers
  OPERA DISP-S1 products, downloads + crops, builds the displacement stack,
  picks a reference (auto or manual), estimates per-pixel velocity, and
  exports cumulative + velocity GeoTIFFs.
owner: ${apiUserId}
group_id: subside-ops
tenant_id: portals

params:
  start_date:          {type: string, required: true}
  end_date:            {type: string, required: true}
  aoi_geojson_uri:     {type: string, required: true}
  earthdata_netrc_uri: {type: string, required: false}
  reference_mode:      {type: string, default: "auto", enum: [auto, manual, none]}
  reference_lat:       {type: number, required: false}
  reference_lon:       {type: number, required: false}
  anchor_radius_m:     {type: integer, default: 5000}
  n_reference_pixels:  {type: integer, default: 25}
  num_workers:         {type: integer, default: 4}
  min_overlap_percent: {type: number, default: 50.0}
  allocation:          {type: string, required: true}
  update_conda_env:    {type: string, default: "false"}
  # --- STAC/CKAN publishing (stac-platform). Leave ckan_token/stac_url blank to
  #     disable: the stac-publish task no-ops when either is unset. ---
  stac_collection:     {type: string, default: "subsidence-rates", description: "CKAN dataset = STAC Collection id"}
  stac_item_id:        {type: string, required: false, description: "Unique STAC Item id for this run (defaults to the run job name)"}
  ckan_url:            {type: string, default: "https://ckan.tacc.utexas.edu"}
  ckan_org:            {type: string, default: "tacc-water"}
  ckan_token:          {type: string, required: false, description: "CKAN API token / user Tapis token (blank disables publishing)"}
  stac_url:            {type: string, required: false, description: "STAC API base URL incl. /api/v1 (blank disables publishing)"}
  stac_token:          {type: string, required: false, description: "STAC Transactions bearer (defaults to the user's Tapis token)"}

tasks:

  - id: run
    type: tapis_job
    depends_on: []
    description: Discover + download + stack + reference + velocity + export, all in one job (STAGE=run).
    tapis_job_def:
      appId: subside-werc-opera-analysis
      appVersion: "0.1.1"
      name: subside-werc-opera-{{ args.start_date }}-{{ args.end_date }}
      nodeCount: 1
      coresPerNode: 16
      memoryMB: 128000
      maxMinutes: 300
      fileInputs:
        - name: aoi-geojson
          sourceUrl: "{{ args.aoi_geojson_uri }}"
        - name: earthdata-netrc
          sourceUrl: "{{ args.earthdata_netrc_uri }}"
      parameterSet:
        # Run parameters are passed as env-variable input fields; the app's
        # run.sh materializes them into the CLI config (no run-config file).
        envVariables:
          - {key: STAGE, value: "run"}
          - {key: UPDATE_CONDA_ENV, value: "{{ args.update_conda_env }}"}
          - {key: START_DATE, value: "{{ args.start_date }}"}
          - {key: END_DATE, value: "{{ args.end_date }}"}
          - {key: NUM_WORKERS, value: "{{ args.num_workers }}"}
          - {key: MIN_OVERLAP_PERCENT, value: "{{ args.min_overlap_percent }}"}
          - {key: REFERENCE_MODE, value: "{{ args.reference_mode }}"}
          - {key: REFERENCE_LAT, value: "{{ args.reference_lat }}"}
          - {key: REFERENCE_LON, value: "{{ args.reference_lon }}"}
          - {key: ANCHOR_RADIUS_M, value: "{{ args.anchor_radius_m }}"}
          - {key: N_REFERENCE_PIXELS, value: "{{ args.n_reference_pixels }}"}
        schedulerOptions:
          - name: "TACC Allocation"
            arg: "{{ args.allocation }}"

  - id: publish
    type: function
    runtime: "python:3.11"
    installer: pip          # required by the Tapis Workflows FunctionTask schema
    packages: []            # stdlib-only; no third-party deps to install
    depends_on:
      - id: run
    description: |
      Stdlib-only Python. Reads the werc-run-manifest.json the run job already
      wrote (it is itself the unified manifest) and re-emits it as
      subside-run-manifest.json. (Under the manager this runs locally via the
      Files API.)
    inputs:
      werc_run_manifest_uri: "{{ tasks.run.outputs.archive }}/output/werc-run-manifest.json"
    code: |
      import json, os, urllib.request

      def _load(uri):
          if uri.startswith("tapis://"):
              raise RuntimeError("Configure tapis-files fetch in your workflows runner.")
          with urllib.request.urlopen(uri) as f:
              return json.load(f)

      werc = _load(os.environ["INPUTS_WERC_RUN_MANIFEST_URI"])
      unified = {"pipeline": "subside-werc-opera", "schema_version": "v0", **werc}
      with open(os.environ["OUTPUT_DIR"] + "/subside-run-manifest.json", "w") as f:
          json.dump(unified, f, indent=2, sort_keys=True, default=str)

  - id: stac-publish
    type: function
    runtime: "python:3.11"
    installer: pip
    # Lightweight env: pip-installs the stac-platform publish core (ckanapi + httpx).
    # No container image, no Singularity, no HPC allocation.
    packages:
      - "git+https://github.com/wmobley/stac-platform.git"
    depends_on:
      - id: run
    description: |
      Dual-write this WERC run to CKAN + the STAC API via stacmap.publish.
      Manifest-driven: the orchestrator fetches werc-run-manifest.json from the run
      job's tapis:// archive, then fetches the TWO COGs it names (cumulative +
      velocity) and publishes them as one Item. No-ops when ckan_token / stac_url
      are blank.
    inputs:
      manifest_uri: "{{ tasks.run.outputs.archive }}/output/werc-run-manifest.json"
    env:
      COLLECTION:  "{{ args.stac_collection }}"
      ITEM_ID:     "{{ args.stac_item_id | default('subside-werc-' ~ args.start_date ~ '-' ~ args.end_date, true) }}"
      CKAN_URL:    "{{ args.ckan_url }}"
      CKAN_ORG:    "{{ args.ckan_org }}"
      CKAN_TOKEN:  "{{ args.ckan_token }}"
      STAC_URL:    "{{ args.stac_url }}"
      STAC_TOKEN:  "{{ args.stac_token }}"
    code: |
      # Hosted-engine path (the local orchestrator runs _run_stac_publish instead,
      # which fetches tapis:// files via the Files API). stacmap.publish auto-detects
      # the WERC manifest (cumulative + velocity COGs).
      import os
      from stacmap.publish import publish_from_dir
      if not (os.environ.get("CKAN_TOKEN") and os.environ.get("STAC_URL")):
          print("stac-publish: disabled (CKAN_TOKEN/STAC_URL unset) — skipping.")
      else:
          manifest = os.environ.get("INPUTS_MANIFEST_LOCAL", "werc-run-manifest.json")
          item = publish_from_dir(collection_id=os.environ["COLLECTION"],
                                  manifest_path=manifest, item_id=os.environ["ITEM_ID"],
                                  files_dir=os.path.dirname(manifest) or ".")
          print(f"published {item['id']} -> {os.environ['COLLECTION']}")
