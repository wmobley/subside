name: Build SUBSIDE service images

# Builds the deployable UI and API images (for Tapis pods) and pushes them to
# GHCR. Separate from build-images.yml, which builds the OPERA Tapis batch apps.

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "api/**"
      - "analysis/**"
      - "tapis/workflows/pipelines/**"
      - ".github/workflows/build-services.yml"
  pull_request:
    paths:
      - "ui/**"
      - "api/**"
      - "analysis/**"
      - "tapis/workflows/pipelines/**"
      - ".github/workflows/build-services.yml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to ghcr.io"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python lint tooling
        run: pip install -r requirements-dev.txt

      - name: Lint Python (api + tapis + analysis)
        run: make lint RUFF=ruff

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        run: npm ci
        working-directory: ui

      - name: Lint UI
        run: make lint-ui

  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ui
            image: subside-ui
            dockerfile: ui/Dockerfile
          - name: api
            image: subside-api
            dockerfile: api/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR's token endpoint occasionally times out from runners; retry a few
      # times so a single transient blip doesn't fail the whole build.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4; do
            if echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; then
              exit 0
            fi
            echo "GHCR login attempt $attempt failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "GHCR login failed after 4 attempts." >&2
          exit 1

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Decide whether to push
        id: push
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build${{ steps.push.outputs.value == 'true' && ' and push' || '' }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ steps.push.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
