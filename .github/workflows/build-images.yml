name: Build SUBSIDE Tapis images

on:
  push:
    branches: [main]
    paths:
      - "analysis/**"
      - "tapis/workflow_apps/h2i_lab/**"
      - "tapis/workflow_apps/werc/**"
      - ".dockerignore"
      - ".github/workflows/build-images.yml"
  pull_request:
    paths:
      - "analysis/**"
      - "tapis/workflow_apps/h2i_lab/**"
      - "tapis/workflow_apps/werc/**"
      - ".dockerignore"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to ghcr.io"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: h2i_lab
            image: subside-h2i-opera-analysis
            dockerfile: tapis/workflow_apps/h2i_lab/Dockerfile
          - name: werc
            image: subside-werc-opera-analysis
            dockerfile: tapis/workflow_apps/werc/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Decide whether to push
        id: push
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build${{ steps.push.outputs.value == 'true' && ' and push' || '' }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ steps.push.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # Re-point the registered Tapis apps at THIS build's immutable :sha-<gitsha> tag,
  # so the next pipeline run uses the exact code just pushed — no manual
  # patch_app_image.py, no GHCR-pruning surprise, and the changing digest busts the
  # exec host's Singularity SIF cache. Needs owner-scoped Tapis creds (patching an
  # app requires MODIFY, which only the owner holds); the step no-ops with a warning
  # if the secrets aren't configured.
  register-apps:
    name: Re-point Tapis apps at this image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-point apps to sha-<gitsha>
        env:
          TAPIS_BASE_URL: https://portals.tapis.io
          TAPIS_ID: ${{ secrets.TAPIS_ID }}
          TAPIS_PASSWORD: ${{ secrets.TAPIS_PASSWORD }}
        run: |
          if [ -z "${TAPIS_ID}" ] || [ -z "${TAPIS_PASSWORD}" ]; then
            echo "::warning::TAPIS_ID/TAPIS_PASSWORD secrets not set — skipping app re-point. "\
                 "Run patch_app_image.py --image-tag sha-${GITHUB_SHA:0:7} manually (owner)."
            exit 0
          fi
          pip install --quiet tapipy
          python tapis/workflow_apps/patch_app_image.py --image-tag "sha-${GITHUB_SHA:0:7}"
