# Tooling config for the SUBSIDE Python code (the FastAPI service in api/ and the
# Tapis automation in tapis/). Not a packaged project — this only holds tool
# config. Run the linter with `make lint` (or `ruff check api tapis`).
[tool.ruff]
# Code targets 3.9+ (it uses `from __future__ import annotations` so newer typing
# syntax works on 3.9); the deployed pods run 3.12.
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Ruff's default rule set (E4/E7/E9 + F) is the minimal "real bug" net: syntax
# errors, the high-signal pycodestyle errors, and pyflakes (unused/undefined/
# redefined names, bad f-strings). This mirrors the UI's `npm run lint` intent —
# catch mistakes the runtime would otherwise hit — without imposing style churn.
# (Line-length E501 is intentionally not enabled.)

[tool.ruff.lint.per-file-ignores]
# Walkthroughs are notebook-style scripts: imports are interleaved with narrated
# setup steps, so module-level-import-not-at-top is expected, not a defect.
"**/walkthrough.py" = ["E402"]

[tool.pytest.ini_options]
# Two tiers of tests, kept apart on purpose:
#   * default (unmarked) — small, fast, hermetic unit tests on synthetic data.
#     No network, no Earthdata, no real OPERA products. THIS is the GitHub
#     Actions gate:  pytest -m "not ls6 and not integration"
#   * @pytest.mark.ls6 — whole-flow tests that download real products and run the
#     full pipeline. Heavy; run on an ls6 idev node via ./test.sh, NEVER in CI.
#   * @pytest.mark.integration — needs a live service (running API/STAC/Tapis).
testpaths = ["analysis/tests"]
addopts = "--strict-markers"
markers = [
    "ls6: whole-flow test needing real data/network/compute — run on ls6, not CI",
    "integration: needs a live external service (API/STAC/Tapis) — not in the fast CI gate",
]
