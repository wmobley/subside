# SUBSIDE UI — static SPA serving only. NO reverse proxy.
#
# The browser talks to the SUBSIDE API and the TACC CKAN catalog DIRECTLY
# (cross-origin, CORS-enabled). We do NOT proxy /api/subside through nginx:
# a UI pod cannot reach the API pod by proxying back out through the Tapis
# ingress — that egress times out (504). Instead the app uses the API's public
# URL, injected at container start into /runtime-config.js (see
# docker-entrypoint.d/40-runtime-config.sh). CKAN is likewise called at its
# public origin in production (ui/src/ckan.js).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # runtime-config.js and the SPA shell must never be cached (config + the
    # hashed-asset references both change on deploy).
    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Content-addressed Vite build assets: safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
